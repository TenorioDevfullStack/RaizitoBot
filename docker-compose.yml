version: '3.8'

services:
  raizitobot:
    build: .
    container_name: raizitobot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DB_PATH=${DB_PATH:-data/bot_data.db}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY:-}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX:-}
      - GOOGLE_SERVICE_ACCOUNT_FILE=${GOOGLE_SERVICE_ACCOUNT_FILE:-/app/service_account.json}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_DELEGATED_USER=${GOOGLE_DELEGATED_USER:-}
      - GOOGLE_USE_DOMAIN_WIDE_DELEGATION=${GOOGLE_USE_DOMAIN_WIDE_DELEGATION:-false}
      - GOOGLE_GMAIL_USE_DELEGATION=${GOOGLE_GMAIL_USE_DELEGATION:-true}
      - GOOGLE_DRIVE_USE_DELEGATION=${GOOGLE_DRIVE_USE_DELEGATION:-false}
      - GOOGLE_CALENDAR_USE_DELEGATION=${GOOGLE_CALENDAR_USE_DELEGATION:-false}
      - GOOGLE_DOCS_USE_DELEGATION=${GOOGLE_DOCS_USE_DELEGATION:-false}
      - GOOGLE_GMAIL_USER_ID=${GOOGLE_GMAIL_USER_ID:-me}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GOOGLE_CALENDAR_TIMEZONE=${GOOGLE_CALENDAR_TIMEZONE:-America/Sao_Paulo}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GOOGLE_MAPS_LANGUAGE=${GOOGLE_MAPS_LANGUAGE:-pt-BR}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-stdio}
      - APP_USERNAME=${APP_USERNAME:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - CUSTOM_API_URL=${CUSTOM_API_URL:-https://pro.raizeletrica.com.br}
    volumes:
      - ./data:/app/data
      - ./service_account.json:/app/service_account.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
